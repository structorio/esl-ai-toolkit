<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tool · ESL AI Toolkit</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1><a href="index.html" style="color:#fff;text-decoration:none">🗣️ ESL AI Toolkit</a></h1></header><div class="box" id="t"></div>
<script src="data/tools.js"></script><script>
const t=TOOLS.find(x=>x.id==new URLSearchParams(location.search).get("id"));const e=document.getElementById("t");
e.innerHTML=!t?"Tool not found.":`<h2>${t.name}</h2><p><a href="${t.url}" target="_blank" rel="noopener">${t.url}</a></p>
<p><b>CEFR:</b> ${t.levels.join(", ")}</p><p><b>Skills:</b> ${t.skills.join(", ")}</p><p><b>For:</b> ${t.audience}</p><p>${t.note}</p><p><b>Price:</b> ${t.price_tier} · ${t.starting_price} ${t.pricing_verified?"":"<span class='tag warn'>unverified</span>"} (<a href="${t.pricing_source}" target="_blank" rel="noopener">pricing page</a>)</p>
<p style="font-size:13px;color:#666">Last checked ${t.last_checked}.</p>`;</script></body></html>
